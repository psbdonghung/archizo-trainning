<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/archizo-trainning/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Theo dõi chỉ số cơ thể, kế hoạch tập và ăn uống tại nhà.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0E120C">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Archizo Training">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Archizo Training</title>
  <link rel="manifest" href="manifest.json">

  <!-- Bắt tay sớm với máy chủ CanvasKit và phông chữ; tải main.dart.js song
       song với flutter_bootstrap.js. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
</head>
<body style="background:#0E120C;margin:0">
  <!-- Màn chờ: hiện ngay khi mở, tự ẩn khi app vẽ xong khung đầu tiên.
       Nếu tải lâu hoặc lỗi thì hiện lý do và nút xử lý, thay vì màn đen. -->
  <div id="loading" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#0E120C;color:#F2F4EE;font:16px -apple-system,system-ui,sans-serif;text-align:center">
    <img src="icons/Icon-192.png" width="96" height="96" alt="">
    <div id="loading-text">Đang tải Archizo Training…</div>
    <div id="loading-help" style="display:none;max-width:340px;color:#8D9089;font-size:14px;line-height:1.5">
      <div id="loading-error" style="color:#FFB020;margin-bottom:12px;word-break:break-word"></div>
      <button onclick="location.reload()" style="width:100%;padding:12px;border-radius:999px;border:0;background:#CFE80C;color:#0E120C;font-size:16px;margin-bottom:8px">Tải lại</button>
      <button onclick="archizoReset()" style="width:100%;padding:12px;border-radius:999px;border:1px solid #CFE80C;background:none;color:#CFE80C;font-size:16px">Xóa bản lưu tạm và tải lại</button>
      <div style="margin-top:8px">Nút thứ hai chỉ xóa bản app lưu tạm, không xóa dữ liệu bạn đã nhập.</div>
    </div>
  </div>
  <script>
    (function () {
      var box = document.getElementById('loading');
      function help(msg) {
        if (!box.isConnected) return;
        document.getElementById('loading-text').textContent =
          msg ? 'Không mở được app.' : 'Tải lâu hơn bình thường. Hãy chờ thêm hoặc thử các nút dưới.';
        if (msg) document.getElementById('loading-error').textContent = msg;
        document.getElementById('loading-help').style.display = 'block';
      }
      window.addEventListener('flutter-first-frame', function () { box.remove(); });
      window.addEventListener('error', function (e) { help('Lỗi: ' + (e.message || (e.target && e.target.src) || 'không rõ')); }, true);
      window.addEventListener('unhandledrejection', function (e) { help('Lỗi: ' + (e.reason && (e.reason.message || e.reason))); });
      setTimeout(function () { help(); }, 25000);
      window.archizoReset = async function () {
        try {
          if ('serviceWorker' in navigator) {
            for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
          }
          if (window.caches) {
            for (const k of await caches.keys()) await caches.delete(k);
          }
        } catch (_) {}
        location.reload();
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Không dùng service worker (dễ giữ bản cũ trên iPhone). Gỡ bản cũ nếu còn.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  </script>
</body>
</html>
